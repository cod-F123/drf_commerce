services:

  db:
    image: postgres:18
    container_name: postgres-dev
    environment:
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  core:
    build: .
    container_name: core

    volumes:
      - ./core:/app

    ports:
      - 8000:8000

    env_file:
      - .env

    command: python manage.py runserver 0.0.0.0:8000

    depends_on:
      - db

volumes:
  postgres_data:
